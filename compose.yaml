name: shoerag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: shoerag
      POSTGRES_USER: shoerag_owner
      POSTGRES_PASSWORD: dev_owner_password
    # Loopback only. The scope decision at readme.md 5.2 keeps the database on the
    # developer machine; published on all interfaces it would be reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/compose/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoerag_owner -d shoerag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data: 
